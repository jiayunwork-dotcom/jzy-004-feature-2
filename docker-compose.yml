services:
  crc-service:
    build: .
    image: crc-service:1.0.0
    container_name: crc-service
    ports:
      - "8080:8080"
    environment:
      # 监听地址，可改为 :其它端口
      CRC_LISTEN_ADDR: ":8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/crcsrv", "-healthcheck-uri", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
